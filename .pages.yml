
media:
  - name: images
    label: Page images
    input: public/media
    output: /media
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
    rename: safe

content:
  - name: home
    label: Home page
    type: file
    path: src/content/pages/home.json
    format: json
    fields:
      - name: language
        label: 00. Language
        type: string
        required: true
        description: Page language code, for example "en" or "sv".
      - name: seo
        label: 01. SEO and browser title
        type: object
        description: Search result and browser tab text.
        fields:
          - name: title
            label: Page title
            type: string
            required: true
          - name: description
            label: Meta description
            type: text
            required: true
      - name: hero
        label: 02. Hero section
        type: object
        description: Original exp site hero content. Image field controls the video poster image.
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: title
            label: Main headline
            type: string
            required: true
          - name: lead
            label: Lead paragraph
            type: text
            required: true
          - name: image
            label: Hero poster image
            type: image
            required: true
            options:
              media: images
              path: public/media
              extensions: [jpg, jpeg, png, webp]
          - name: primaryAction
            label: Primary button
            type: object
            fields:
              - name: label
                label: Button text
                type: string
              - name: href
                label: Button URL
                type: string
          - name: secondaryAction
            label: Secondary button
            type: object
            fields:
              - name: label
                label: Button text
                type: string
              - name: href
                label: Button URL
                type: string
      - name: intro
        label: 03. Intro section
        type: object
        description: Original intro block below the hero.
        fields:
          - name: title
            label: Section headline
            type: string
          - name: body
            label: Section text
            type: text
      - name: principles
        label: 04. Principle cards
        type: object
        description: Original three cards in the intro section.
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Card title
            type: string
          - name: description
            label: Card text
            type: text
      - name: stories
        label: 05. Story strip images
        type: object
        description: Original story strip. Changing an image here updates the public story image.
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Story title
            type: string
          - name: image
            label: Story image
            type: image
            options:
              media: images
              path: public/media
              extensions: [jpg, jpeg, png, webp]
          - name: href
            label: Target URL
            type: string
      - name: paths
        label: 06. Path card images and links
        type: object
        description: Original path cards. Changing an image here updates the public card image.
        list:
          collapsible:
            collapsed: true
            summary: "{title} - {subtitle}"
        fields:
          - name: title
            label: Card title
            type: string
          - name: subtitle
            label: Small label
            type: string
          - name: image
            label: Card image
            type: image
            options:
              media: images
              path: public/media
              extensions: [jpg, jpeg, png, webp]
          - name: href
            label: Target URL
            type: string
          - name: description
            label: Card text
            type: text
      - name: contact
        label: 07. Contact section
        type: object
        description: Original contact section.
        fields:
          - name: title
            label: Section headline
            type: string
          - name: body
            label: Section text
            type: text
          - name: links
            label: Contact cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Card title
                type: string
              - name: label
                label: Link label
                type: string
              - name: href
                label: Link URL
                type: string
              - name: description
                label: Card text
                type: text
