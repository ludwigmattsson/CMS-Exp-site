
media:
  input: public/media
  output: /media
  extensions: [jpg, jpeg, png, webp]
  categories: [image]
  rename: safe

content:
  - name: media-assets
    label: Media library
    type: collection
    path: src/content/media-assets
    format: json
    filename: "{title}.json"
    view:
      primary: title
      fields: [usage, image, preview]
    fields:
      - name: title
        label: Image name
        type: string
        required: true
        description: Human-readable name shown in Home image pickers.
      - name: usage
        label: Used for
        type: string
        required: true
        description: Example: Hero poster, Path card, Story strip.
      - name: image
        label: Image path or URL
        type: string
        required: true
        description: Use /media/filename.jpg for uploaded files in public/media, or paste a full external image URL.
      - name: preview
        label: Preview URL
        type: string
        description: Optional. Used only so Pages can show thumbnails in Home image pickers. For /media images, use https://raw.githubusercontent.com/ludwigmattsson/CMS-Exp-site/main/public/media/filename.jpg.

  - name: home
    label: Home page
    type: file
    path: src/content/pages/home.json
    format: json
    fields:
      - name: language
        label: 00. Language
        type: string
        required: true
        description: Page language code, for example "en" or "sv".
      - name: seo
        label: 01. SEO and browser title
        type: object
        description: Search result and browser tab text.
        fields:
          - name: title
            label: Page title
            type: string
            required: true
          - name: description
            label: Meta description
            type: text
            required: true
      - name: hero
        label: 02. Hero section
        type: object
        description: Original exp site hero content. Image field controls the video poster image.
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: title
            label: Main headline
            type: string
            required: true
          - name: lead
            label: Lead paragraph
            type: text
            required: true
          - name: image
            label: Hero poster image
            type: reference
            required: true
            description: Pick from Media library. To add a new image, upload it under Media, create a Media library item, then select it here.
            options:
              collection: media-assets
              search: title,usage,image
              value: "{image}"
              label: "{title} - {usage}"
              image: "{preview}"
          - name: primaryAction
            label: Primary button
            type: object
            fields:
              - name: label
                label: Button text
                type: string
              - name: href
                label: Button URL
                type: string
          - name: secondaryAction
            label: Secondary button
            type: object
            fields:
              - name: label
                label: Button text
                type: string
              - name: href
                label: Button URL
                type: string
      - name: intro
        label: 03. Intro section
        type: object
        description: Original intro block below the hero.
        fields:
          - name: title
            label: Section headline
            type: string
          - name: body
            label: Section text
            type: text
      - name: principles
        label: 04. Principle cards
        type: object
        description: Original three cards in the intro section.
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Card title
            type: string
          - name: description
            label: Card text
            type: text
      - name: stories
        label: 05. Story strip images
        type: object
        description: Original story strip. Changing an image here updates the public story image.
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Story title
            type: string
          - name: image
            label: Story image
            type: reference
            description: Pick from Media library. The selected image is rendered in this story card.
            options:
              collection: media-assets
              search: title,usage,image
              value: "{image}"
              label: "{title} - {usage}"
              image: "{preview}"
          - name: href
            label: Target URL
            type: string
      - name: paths
        label: 06. Path card images and links
        type: object
        description: Original path cards. Changing an image here updates the public card image.
        list:
          collapsible:
            collapsed: true
            summary: "{title} - {subtitle}"
        fields:
          - name: title
            label: Card title
            type: string
          - name: subtitle
            label: Small label
            type: string
          - name: image
            label: Card image
            type: reference
            description: Pick from Media library. The selected image is rendered in this path card.
            options:
              collection: media-assets
              search: title,usage,image
              value: "{image}"
              label: "{title} - {usage}"
              image: "{preview}"
          - name: href
            label: Target URL
            type: string
          - name: description
            label: Card text
            type: text
      - name: contact
        label: 07. Contact section
        type: object
        description: Original contact section.
        fields:
          - name: title
            label: Section headline
            type: string
          - name: body
            label: Section text
            type: text
          - name: links
            label: Contact cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Card title
                type: string
              - name: label
                label: Link label
                type: string
              - name: href
                label: Link URL
                type: string
              - name: description
                label: Card text
                type: text
